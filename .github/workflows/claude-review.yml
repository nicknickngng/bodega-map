# AI code-health review: a fresh Claude instance reviews each pull request's
# diff against REVIEW.md and posts comments. Advisory only (never blocks merge).
#
# Setup (one time, by the repo owner):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Add ONE of these repository secrets (Settings → Secrets and variables → Actions):
#      - CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token` (uses your Claude subscription)
#      - ANTHROPIC_API_KEY        — an Anthropic API key (pay per use)
# Until a secret exists, the review job skips itself instead of failing.
name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (GitHub doesn't give forks access to secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check that a Claude credential is configured
        id: auth
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" = "true" ] || [ "$HAS_KEY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude review: add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repository secret."
          fi

      - name: Checkout repository
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude code-health review
        if: steps.auth.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a code-health reviewer for this repository. Read REVIEW.md at the
            repo root first and follow it exactly: it defines what to review, what to
            ignore, and how to report. Review only this pull request's changes (use
            `gh pr diff` and `gh pr view`), reading surrounding code where needed to
            judge correctness.

            Post specific problems as inline comments on the relevant lines. Finish with
            one top-level PR comment summarizing the review in the format REVIEW.md asks
            for. If you find nothing worth flagging, say so briefly rather than inventing
            issues.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
